<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finesse — Weekly Report Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1B2A4A; --navy-mid:#243661; --sky:#5BB8E8; --sky-light:#8dd0f2;
    --border:#d9e2ee; --ink:#1B2A4A; --muted:#6b7c93; --bg:#f4f7fb; --card:#ffffff;
    --green:#1f7a45; --green-bg:rgba(87,211,140,.15); --red:#c0392b; --red-bg:#fdeaea;
    --amber:#c0651f; --amber-bg:#fff2df; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Open Sans',sans-serif; min-height:100vh; }

  .header { background:var(--navy); padding:0 20px; display:flex; align-items:center; justify-content:space-between; min-height:70px; border-bottom:3px solid var(--sky); }
  .header-logo { height:44px; width:auto; display:block; }
  .header-right { text-align:right; }
  .header-right h1 { font-family:'Montserrat',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; color:#fff; text-transform:uppercase; }
  .header-right p { font-size:10px; color:var(--sky-light); letter-spacing:1px; text-transform:uppercase; margin-top:3px; }

  /* login */
  .login { display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 73px); padding:32px 20px; }
  .login-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:34px 26px; width:100%; max-width:340px; box-shadow:0 4px 20px rgba(27,42,74,.10); }
  .login-card h2 { font-family:'Montserrat',sans-serif; font-weight:700; font-size:15px; color:var(--navy); letter-spacing:1px; text-transform:uppercase; text-align:center; margin-bottom:6px; }
  .login-card p { font-size:12px; color:var(--muted); text-align:center; margin-bottom:24px; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
  .login-field input { width:100%; background:var(--bg); border:1px solid var(--border); font-size:15px; padding:12px 14px; border-radius:6px; outline:none; }
  .login-field input:focus { border-color:var(--sky); }
  .login-btn { width:100%; background:var(--navy); color:#fff; border:none; font-family:'Montserrat',sans-serif; font-weight:700; font-size:14px; letter-spacing:2px; text-transform:uppercase; padding:14px; border-radius:6px; cursor:pointer; margin-top:6px; }
  .login-btn:hover { background:var(--navy-mid); }
  .login-err { background:#fff0f0; border:1px solid #f5c6c6; border-radius:6px; padding:10px; font-size:12px; color:#c0392b; text-align:center; margin-top:12px; display:none; }
  .login-err.show { display:block; }

  .wrap { max-width:900px; margin:0 auto; padding:18px 16px 40px; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .toolbar h2 { font-family:'Montserrat',sans-serif; font-size:14px; font-weight:800; color:var(--navy); }
  .toolbar .week { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:3px; }
  .week-select { margin-top:5px; font-family:'Open Sans',sans-serif; font-size:12px; font-weight:600; color:var(--navy); background:var(--card); border:1px solid var(--border); border-radius:6px; padding:6px 10px; cursor:pointer; outline:none; }
  .week-select:focus { border-color:var(--sky); }
  .refresh { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:9px 14px; font-size:12px; font-weight:700; color:var(--navy); cursor:pointer; }
  .refresh:hover { border-color:var(--sky); }
  .asof { font-size:11px; color:var(--muted); margin-left:10px; }

  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .kpi.warn { border-color:#f3c9a0; background:var(--amber-bg); }
  .kpi-n { font-size:26px; font-weight:800; color:var(--navy); line-height:1; }
  .kpi-n small { font-size:15px; color:var(--muted); font-weight:700; }
  .kpi.warn .kpi-n { color:var(--amber); }
  .kpi-l { font-size:11px; color:var(--muted); margin-top:6px; font-weight:600; }

  .cols { display:grid; grid-template-columns:1.05fr 1fr; gap:14px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:4px 14px 12px; }
  .panel-h { font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--navy); padding:12px 2px 8px; border-bottom:1px solid var(--border); }

  .row { border-bottom:1px solid #f0f4f9; }
  .row:last-child { border-bottom:none; }
  .row-top { display:flex; align-items:center; justify-content:space-between; padding:9px 2px; }
  .row.has-report .row-top { cursor:pointer; }
  .name { font-size:13px; font-weight:700; }
  .proj { display:block; font-size:11px; font-weight:500; color:var(--muted); margin-top:1px; }
  .rstat { display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:4px 8px; border-radius:5px; }
  .badge-in { background:var(--green-bg); color:var(--green); }
  .badge-out { background:var(--red-bg); color:var(--red); }
  .time { font-size:11px; color:var(--muted); }
  .fdot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:3px; }
  .fdot.red { background:var(--red); } .fdot.amber { background:var(--amber); }
  .chev { color:var(--muted); font-size:11px; width:12px; text-align:center; }
  .detail { display:none; padding:4px 2px 12px; }
  .detail.open { display:block; }
  .mini-flags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .mini-flag { font-size:11px; font-weight:600; padding:4px 8px; border-radius:5px; }
  .mini-flag.red { background:var(--red-bg); color:var(--red); }
  .mini-flag.amber { background:var(--amber-bg); color:var(--amber); }
  .mini-flag.ok { background:var(--green-bg); color:var(--green); }
  .detail pre { white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.5; color:#2b3a52; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .also { font-size:11px; color:var(--muted); padding:10px 2px 2px; font-style:italic; }

  .flag { display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid #f0f4f9; align-items:flex-start; }
  .flag:last-child { border-bottom:none; }
  .flag-tag { font-size:9px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:4px 7px; border-radius:5px; flex-shrink:0; margin-top:1px; }
  .flag.red .flag-tag { background:var(--red-bg); color:var(--red); }
  .flag.amber .flag-tag { background:var(--amber-bg); color:var(--amber); }
  .flag.gray .flag-tag { background:#eef2f8; color:#5a6b82; }
  .flag-body { font-size:12px; line-height:1.45; }
  .allclear { font-size:12px; color:var(--muted); padding:14px 2px; text-align:center; }
  .state { padding:40px 20px; text-align:center; color:var(--muted); font-size:13px; }
  .spin { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--sky); border-radius:50%; animation:sp .7s linear infinite; margin:0 auto 12px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .foot { text-align:center; font-size:11px; color:var(--muted); padding:16px; }
  @media (max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr)} .cols{grid-template-columns:1fr} }
</style>
</head>

  <div class="header-right"><h1>Report Dashboard</h1><p>Leadership View</p></div>
</div>

<div id="login" class="login">
  <div class="login-card">
    <h2>Report Dashboard</h2>
    <p>Enter your username and PIN.</p>
    <div class="login-field"><label>Username</label><input type="text" id="u" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. dsimons"></div>
    <div class="login-field"><label>PIN</label><input type="password" id="p" maxlength="6" inputmode="numeric" placeholder="••••"></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="lerr">Incorrect username or PIN.</div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="wrap">
    <div class="toolbar">
      <div><h2>Weekly Report Dashboard</h2><select id="week-select" class="week-select" onchange="loadWeek(this.value)"></select></div>
      <div><button class="refresh" onclick="reload()">↻ Refresh</button><span class="asof" id="asof"></span></div>
    </div>
    <div id="content"><div class="state"><div class="spin"></div>Loading this week's reports…</div></div>
  </div>
</div>

<div class="foot">Finesse Construction LLC — Internal Use Only</div>

<script>
  const API_BASE  = 'https://finesse-lookahead.finessecheckins.workers.dev';
  const USERS = {
    'rmiranda':{pin:'4351',name:'Robert Miranda'}, 'smorris':{pin:'1913',name:'Steve Morris'},
    'jgullion':{pin:'4111',name:'Joe Gullion'}, 'dsimons':{pin:'9210',name:'Darryl Simons'},
    'ccostenbader':{pin:'4420',name:'Cody Costenbader'}, 'jbrown':{pin:'2340',name:'Jared Brown'},
    'mdesha':{pin:'9886',name:'Myles DeSha'}, 'dwood':{pin:'4879',name:'Dennis Wood'},
    'kmaki':{pin:'3461',name:'Ken Maki'}, 'mramirez':{pin:'1715',name:'Marco Ramirez'},
    'bmillwood':{pin:'4954',name:'Bill Millwood'}, 'dgreathouse':{pin:'3282',name:'Doug Greathouse'},
  };
  const SUPERS = [
    {name:'Dennis Wood',project:'Palm Canyon'}, {name:'Ken Maki',project:'Sherman Place'},
    {name:'Marco Ramirez',project:'Amazing Explorers Queen Creek'}, {name:'Bill Millwood',project:'Palo on 75th'},
    {name:'Doug Greathouse',project:'Sherman Place'},
  ];

  const pad=n=>String(n).padStart(2,'0');
  const fmtUS=d=>pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear();
  function currentWeekEnding(){ const t=new Date(),d=t.getDay(),f=new Date(t); f.setDate(t.getDate()+(d===5?0:(5-d+7)%7)); return fmtUS(f); }
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  function doLogin(){
    const u=document.getElementById('u').value.trim().toLowerCase();
    const p=document.getElementById('p').value.trim();
    const user=USERS[u];
    if(user && user.pin===p){
      document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='block';
      reload();
    } else {
      document.getElementById('lerr').classList.add('show');
      document.getElementById('p').value='';
    }
  }
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('p').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
    document.getElementById('u').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('p').focus(); });
  });

  let allWeeks=[];
  async function loadWeeks(){
    let weeks=[];
    try{ const r=await fetch(API_BASE+'/weeks'); const j=await r.json(); weeks=(j&&j.weeks)||[]; }catch(e){ weeks=[]; }
    const cur=currentWeekEnding();
    if(!weeks.includes(cur)) weeks.unshift(cur);   // always offer the current week
    allWeeks=weeks;
    const sel=document.getElementById('week-select');
    sel.innerHTML=weeks.map(w=>'<option value="'+w+'">'+(w===cur?('This week — '+w):('Week ending '+w))+'</option>').join('');
    sel.value=cur;
  }
  async function loadWeek(week){
    document.getElementById('content').innerHTML='<div class="state"><div class="spin"></div>Loading reports…</div>';
    let reports=[];
    try{
      const res=await fetch(API_BASE+'/reports?week='+encodeURIComponent(week));
      const j=await res.json();
      reports=(j&&j.reports)||[];
    }catch(err){
      document.getElementById('content').innerHTML='<div class="state">Couldn\'t load reports right now.<br><br>'+esc(err.message)+'<br><br>Tap Refresh to try again.</div>';
      return;
    }
    render(week, reports);
    document.getElementById('asof').textContent='as of '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  }
  async function reload(){
    await loadWeeks();
    await loadWeek(document.getElementById('week-select').value);
  }

  function timeShort(iso){ try{ const d=new Date(iso); return d.toLocaleDateString([], {weekday:'short'})+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }

  function render(target, reports){
    const byName={}; reports.forEach(r=>{ byName[(r.name||'').toLowerCase()]=r; });
    const rosterKeys=SUPERS.map(s=>s.name.toLowerCase());
    let inCount=0, nearMiss=0, inspCount=0, attn=0; const attnItems=[];
    let rows='';
    SUPERS.forEach((sup,idx)=>{
      const r=byName[sup.name.toLowerCase()];
      if(r){
        inCount++;
        if(/^yes/i.test(r.nearMiss||'')) nearMiss++;
        inspCount += (r.inspections||[]).length;
        const dots=[];
        const hasPM=/^yes/i.test(r.pmAction||''), hasNM=/^yes/i.test(r.nearMiss||'');
        if(hasPM){ dots.push('<span class="fdot red"></span>'); attn++; attnItems.push({t:'red',tag:'PM action',b:'<strong>'+esc(sup.name)+' · '+esc(r.project)+'</strong><br>'+esc(r.pmDetail||'Yes')}); }
        if(hasNM){ dots.push('<span class="fdot red"></span>'); attn++; attnItems.push({t:'red',tag:'Near-miss',b:'<strong>'+esc(sup.name)+' · '+esc(r.project)+'</strong><br>'+esc(r.nearMissDetail||'Yes')}); }
        (r.concerns||[]).forEach(c=>{ attn++; attnItems.push({t:'amber',tag:'Concern',b:'<strong>'+esc(sup.name)+' · '+esc(r.project)+'</strong><br>'+esc(c)}); });
        if((r.concerns||[]).length) dots.push('<span class="fdot amber"></span>');
        const mf=[];
        mf.push(hasPM?'<span class="mini-flag red">PM action needed</span>':'<span class="mini-flag ok">No PM action</span>');
        mf.push(hasNM?'<span class="mini-flag red">Near-miss</span>':'<span class="mini-flag ok">No near-miss</span>');
        (r.concerns||[]).forEach(c=>mf.push('<span class="mini-flag amber">'+esc(c)+'</span>'));
        rows+='<div class="row has-report"><div class="row-top" onclick="tog('+idx+')">'
          +'<div class="name">'+esc(sup.name)+'<span class="proj">'+esc(r.project||sup.project)+'</span></div>'
          +'<div class="rstat">'+dots.join('')+'<span class="badge badge-in">✓ In</span><span class="time">'+timeShort(r.submittedAt)+'</span><span class="chev" id="cv'+idx+'">›</span></div>'
          +'</div><div class="detail" id="dt'+idx+'"><div class="mini-flags">'+mf.join('')+'</div>'
          +(r.text?'<pre>'+esc(r.text)+'</pre>':'')+'</div></div>';
      } else {
        rows+='<div class="row"><div class="row-top"><div class="name">'+esc(sup.name)+'<span class="proj">'+esc(sup.project)+'</span></div>'
          +'<div class="rstat"><span class="badge badge-out">Missing</span></div></div></div>';
      }
    });
    const extras=Object.keys(byName).filter(k=>rosterKeys.indexOf(k)<0).map(k=>byName[k].name);
    const missing=SUPERS.filter(s=>!byName[s.name.toLowerCase()]).map(s=>s.name);
    let attnHtml='';
    attnItems.forEach(it=>{ attnHtml+='<div class="flag '+it.t+'"><div class="flag-tag">'+esc(it.tag)+'</div><div class="flag-body">'+it.b+'</div></div>'; });
    if(missing.length) attnHtml+='<div class="flag gray"><div class="flag-tag">Chase</div><div class="flag-body"><strong>'+missing.length+' super'+(missing.length>1?'s':'')+' not in yet</strong><br>'+esc(missing.join(', '))+'</div></div>';
    if(!attnHtml) attnHtml='<div class="allclear">Nothing flagged. All submitted reports are clear. ✓</div>';

    document.getElementById('content').innerHTML=
      '<div class="kpis">'
      +'<div class="kpi"><div class="kpi-n">'+inCount+'<small>/'+SUPERS.length+'</small></div><div class="kpi-l">Supers submitted</div></div>'
      +'<div class="kpi'+(attn>0?' warn':'')+'"><div class="kpi-n">'+attn+'</div><div class="kpi-l">Need attention</div></div>'
      +'<div class="kpi"><div class="kpi-n">'+nearMiss+'</div><div class="kpi-l">Near-misses</div></div>'
      +'<div class="kpi"><div class="kpi-n">'+inspCount+'</div><div class="kpi-l">Inspections logged</div></div>'
      +'</div><div class="cols">'
      +'<div class="panel"><div class="panel-h">Submission status</div>'+rows+(extras.length?'<div class="also">Also in: '+esc(extras.join(' · '))+'</div>':'')+'</div>'
      +'<div class="panel"><div class="panel-h">Needs attention</div>'+attnHtml+'</div>'
      +'</div>';
  }
  function tog(i){ const d=document.getElementById('dt'+i), c=document.getElementById('cv'+i); if(!d) return; const o=d.classList.toggle('open'); if(c) c.textContent=o?'˅':'›'; }
</script>
</body>
</html>
